# Static analysis for the Go side: golangci-lint v2 (CI pins the version).
# Zero findings is the bar; a deliberate exception is suppressed on its line
# with //nolint:<linter> // <reason>, or below with the reason.
version: "2"

linters:
  default: standard # errcheck, govet, ineffassign, staticcheck, unused
  enable:
    - bodyclose
    - contextcheck
    - gosec
  settings:
    staticcheck:
      checks:
        - all
        # staticcheck's own defaults
        - -ST1000
        - -ST1003
        - -ST1016
        - -ST1020
        - -ST1021
        - -ST1022
        # Error messages start with product names (Helm, Argo CD) and are shown as they are.
        - -ST1005
        # Naming the embedded struct (cfg.TLSClientConfig.Insecure) says where a field comes from.
        - -QF1008
    gosec:
      excludes:
        # Unchecked errors: errcheck reports them, with the exclusions below.
        - G104
        # Integer conversions here are of counts and sizes far below the limits.
        - G115
        # File paths come from the user's own configuration (kubeconfig, Helm, settings) by design.
        - G304
        # math/rand only names things (pod suffixes, synthetic data); nothing secret is random here.
        - G404
  exclusions:
    presets:
      # Unchecked Close, Flush, Setenv, print: errors there change nothing the
      # caller can act on. Closes that matter (a written file) are checked.
      - std-error-handling
    rules:
      # Tests and the synthetic data generator write fixtures and fake secrets on purpose.
      - path: (_test\.go|^internal/mock/)
        linters:
          - gosec
